<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- Pipeline nodes representing RAG / agent flow -->
  <g opacity="0.9">
    <!-- Query node -->
    <rect x="60" y="150" width="110" height="46" rx="8" fill="url(#nodeGrad)" stroke="#58a6ff" stroke-width="1"/>
    <text x="115" y="178" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">query()</text>

    <line x1="170" y1="173" x2="225" y2="173" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#arrowhead)"/>

    <!-- Embed node -->
    <rect x="230" y="150" width="110" height="46" rx="8" fill="url(#nodeGrad)" stroke="#bc8cff" stroke-width="1"/>
    <text x="285" y="178" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">embed()</text>

    <line x1="340" y1="173" x2="395" y2="173" stroke="#bc8cff" stroke-width="1.2" marker-end="url(#arrowhead)"/>

    <!-- FAISS retrieve node -->
    <rect x="400" y="150" width="120" height="46" rx="8" fill="url(#nodeGrad)" stroke="#58a6ff" stroke-width="1"/>
    <text x="460" y="178" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">retrieve()</text>

    <line x1="520" y1="173" x2="575" y2="173" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#arrowhead)"/>

    <!-- LLM generate node -->
    <rect x="580" y="150" width="120" height="46" rx="8" fill="url(#nodeGrad)" stroke="#bc8cff" stroke-width="1"/>
    <text x="640" y="178" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">generate()</text>

    <line x1="700" y1="173" x2="755" y2="173" stroke="#bc8cff" stroke-width="1.2" marker-end="url(#arrowhead)"/>

    <!-- Response node -->
    <rect x="760" y="150" width="110" height="46" rx="8" fill="url(#nodeGrad)" stroke="#3fb950" stroke-width="1"/>
    <text x="815" y="178" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="13">response</text>
  </g>

  <!-- Knowledge base feeding into retrieve -->
  <rect x="415" y="220" width="90" height="34" rx="6" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="460" y="241" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">vector.index</text>
  <line x1="460" y1="220" x2="460" y2="196" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Name and tagline -->
  <text x="60" y="75" fill="#f0f6fc" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="600">Riya Putti</text>
  <text x="60" y="110" fill="#8b949e" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">Building RAG pipelines, agents &amp; production ML systems</text>

  <rect x="60" y="125" width="120" height="3" fill="url(#accent)"/>
</svg>
